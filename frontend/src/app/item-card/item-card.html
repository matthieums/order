<a [routerLink]="[item().id]">
<div class="card mb-3">
  <img src="{{imageSource}}" class="card-img-top" alt="">
  <div class="card-body">
    <h5 class="card-title">{{ item().name }} - {{ item().id }}</h5>
    <p class="card-text">{{ item().description }}</p>
    <p class="card-text"><small class="text-body-secondary">Price: € {{ item().price }}</small></p>
    <p class="card-text"><small class="text-body-secondary">
      @switch (item().stockUrgency) {
        @case ("STOCK_LOW") {
          <span class="urgency-dot red"></span>
          Low
        }
        @case ("STOCK_MEDIUM") {
          <span class="urgency-dot orange"></span>
          Medium
        }
        @case ("STOCK_HIGH") {
          <span class="urgency-dot green"></span>
          High
        }
        @default {
          Unknown
        }
      }

    </small></p>
  </div>
</div>
</a>
