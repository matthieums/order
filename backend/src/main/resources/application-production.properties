# Datasource properties
# Do not put the actual values under version control, but set and use environment variables of your production server.
spring.datasource.url=jdbc:postgresql://localhost:5432/order
spring.datasource.username=postgres
spring.datasource.password=postgres

# The schema is managed by Flyway (see src/main/resources/db/migration), not by Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
